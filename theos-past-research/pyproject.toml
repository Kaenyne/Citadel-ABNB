[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "abnb-research-toolkit"
version = "0.1.0"
description = "Theo Machado's historical ABNB research toolkit"
requires-python = ">=3.12"
dependencies = [
  "matplotlib",
  "numpy",
  "openpyxl",
  "pandas",
  "pyarrow",
  "pydantic>=2",
  "PyYAML",
  "requests",
  "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
scraping = ["scrapling>=0.4.15,<0.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:datetime.datetime.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning:dateutil.tz.tz",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
