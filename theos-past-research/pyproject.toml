[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abnb-alt-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
scraping = ["scrapling>=0.4.15,<0.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
