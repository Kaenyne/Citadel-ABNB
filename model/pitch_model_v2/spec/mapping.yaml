# Human-authored mapping for spec_seed.py. No input values live here: every input line's
# `values` are generated from a dossier's `### 2a.` table by
# `python3 -m pitch_model_v2.spec_seed`, which writes lines.yaml from this file.
#
# Wave-1 dossiers used: H0 (history), D1 (3Q26 nights), D4 (ADR), D5 (FX), R1 (kernel),
# R3 (cushion), C4 (S&M), V1 (Street), V2 (multiple). See docs/pitch-model-v2/DECISIONS.md
# for the decision ids cited below.

